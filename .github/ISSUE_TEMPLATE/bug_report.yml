name: Bug Report
description: Report a problem with sqlc-gen-richmodel
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps (or a minimal sqlc config + schema/query) that reproduce the problem.
      placeholder: |
        1. Configure `sqlc.yaml` with ...
        2. Run `sqlc generate`
        3. See error/output ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include full error output if applicable.
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`
      placeholder: go version go1.24.0 linux/amd64
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS / environment
      placeholder: e.g. Ubuntu 24.04, macOS 15, GitHub Actions ubuntu-latest
    validations:
      required: true
