name: PostgreSQL Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sqlc_model_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sqlc_model_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SQLC_RICHMODEL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sqlc_model_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - name: Run PostgreSQL integration tests
        run: go test ./tests/integration/...
