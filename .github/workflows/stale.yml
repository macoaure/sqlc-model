name: Stale

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 7
          exempt-issue-labels: "pinned,no-stale"
          exempt-pr-labels: "pinned,no-stale"
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has had no
            activity for 60 days. It will be closed in 7 days if no further activity
            occurs. Comment or update the issue to keep it open.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has
            had no activity for 60 days. It will be closed in 7 days if no further
            activity occurs. Comment or push an update to keep it open.
          close-issue-message: >
            This issue was closed automatically because it has been stale for 7 days
            with no further activity. Feel free to reopen if it's still relevant.
          close-pr-message: >
            This pull request was closed automatically because it has been stale for
            7 days with no further activity. Feel free to reopen if it's still relevant.
