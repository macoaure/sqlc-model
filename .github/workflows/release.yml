name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  verify-tag-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject malformed or out-of-order tag
        run: |
          set -euo pipefail
          current_tag="${GITHUB_REF_NAME}"

          if ! [[ "$current_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$current_tag' is not a valid vMAJOR.MINOR.PATCH tag"
            exit 1
          fi

          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v "^${current_tag}$" | head -n1 || true)

          if [ -n "$latest_tag" ]; then
            highest=$(printf '%s\n%s\n' "$latest_tag" "$current_tag" | sort -V | tail -n1)
            if [ "$highest" != "$current_tag" ]; then
              echo "::error::Tag '$current_tag' is not newer than the latest existing tag '$latest_tag'"
              exit 1
            fi
          fi

  build-and-test:
    needs: verify-tag-order
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.23", "1.24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  lint:
    needs: verify-tag-order
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  release:
    needs: [build-and-test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
